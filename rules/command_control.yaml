- id: SATSUMA-C2-001
  name: Ters shell
  mitre:
    tactic: Command and Control
    technique: T1059.004
  severity: critical
  base_match:
    source: sys_proc
    cmd_contains:
    - bash -i >& /dev/tcp
    - nc -e /bin/bash
    - python3 -c 'import socket
    cmd_regex:
    - /dev/tcp/|nc\s+-e\s+/bin/(?:ba)?sh|(?:connect|create_connection)\s*\(|dup2|pty\.spawn|/bin/(?:ba)?sh
  actions:
  - record
  - evidence
  - ticket
  - correlation_request
  classification: likely
  confidence: high
  dedup_group: reverse_shell
