- id: SATSUMA-RAM-005
  name: RAM içindeki executable kodu bağlı dosyadan farklı
  severity: high
  classification: suspicious
  confidence: high
  category: memory
  base_match:
    source: memory
    action: executable_code_mismatch
  actions:
  - record
  - evidence
  - correlation_request
  schema_version: 1
  implementation_status: CURRENT_TELEMETRY
  requires:
