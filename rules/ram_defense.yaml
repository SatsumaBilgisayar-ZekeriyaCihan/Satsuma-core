- id: SATSUMA-RAM-001
  name: Anonim yazılabilir/çalıştırılabilir bellek bölgesi
  severity: medium
  classification: indicator
  confidence: low
  category: memory
  base_match:
    source: memory
    action: anonymous_rwx
  actions:
  - record
  - evidence
  - correlation_request
  schema_version: 1
  implementation_status: CURRENT_TELEMETRY
