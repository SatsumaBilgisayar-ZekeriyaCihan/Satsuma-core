- id: SATSUMA-PERS-001
  name: Crontab değişikliği
  mitre:
    tactic: Persistence
    technique: T1053.003
  severity: high
  base_match:
    source: audit
    action: file_access
    file_path:
    - /var/spool/cron/*
    - /etc/crontab
    - /etc/cron.d/*
    - /etc/cron.hourly/*
    - /etc/cron.daily/*
    - /etc/cron.weekly/*
    - /etc/cron.monthly/*
    operation: write
  actions:
  - record
  - evidence
  - ticket
  - correlation_request
  classification: suspicious
  confidence: medium
  schema_version: 1
  implementation_status: CURRENT_TELEMETRY
  proof_level: PUBLIC_RESEARCH
  requires:
  - audit.file_path
  false_positives:
  - Yetkili bakım, geliştirme veya güvenlik testi; sonuç ve korelasyon gerekir.
