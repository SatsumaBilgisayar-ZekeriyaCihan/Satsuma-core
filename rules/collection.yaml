- id: SATSUMA-COLL-001
  name: Toplu dosya kopyalama
  severity: high
  base_match:
    source: sys_proc
    cmd_contains:
    - tar -czf /tmp
    - zip -r /tmp
    - cp -r /etc /tmp
    - cp -r /home /tmp
  actions:
  - always: log_only
  classification: indicator
  confidence: low
