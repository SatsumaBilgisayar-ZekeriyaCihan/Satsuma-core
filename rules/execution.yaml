# Regex patterns are written as ^(?>.*?A).*B instead of A.*B (audit K1):
# the engine matches them on single-line text, so only the first A is tried
# and matching stays linear on any command line. Same matches, no stall.
# Düzenli ifadeler A.*B yerine ^(?>.*?A).*B biçiminde yazılır (denetim K1):
# motor tek satıra indirilmiş metinde eşler, yalnızca ilk A denenir ve
# eşleme her komut satırında doğrusal kalır. Eşleşmeler aynı, kilitlenme yok.
- id: SATSUMA-EXEC-001
  name: Ters shell (bash)
  mitre:
    tactic: Execution
    technique: T1059.004
  severity: critical
  base_match:
    source: sys_proc
    cmd_regex:
    - ^(?>.*?\bbash\b)(?>.*?-i).*(?:/dev/tcp/|/dev/udp/)
    - ^(?>.*?\bbash\b)(?>.*?(?:/dev/tcp/|/dev/udp/)).*0>&1
  actions:
  - record
  - evidence
  - ticket
  - correlation_request
  classification: suspicious
  confidence: medium
  dedup_group: reverse_shell
  schema_version: 1
  implementation_status: CURRENT_TELEMETRY
  proof_level: PUBLIC_RESEARCH
  requires:
  - sys_proc.cmd
  false_positives:
  - Yetkili bakım, geliştirme veya güvenlik testi; sonuç ve korelasyon gerekir.
