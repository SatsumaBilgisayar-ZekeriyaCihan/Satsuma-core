- id: SATSUMA-RAM-008
  name: Herkesin yazabildiği klasörden belleğe eşlenmiş çalıştırılabilir kod
  severity: high
  classification: suspicious
  confidence: medium
  category: memory
  base_match:
    source: memory
    action: writable_dir_code_mapping
  actions:
  - record
  - evidence
  - correlation_request
  schema_version: 1
  implementation_status: CURRENT_TELEMETRY
  requires:
  - memory.action
  proof_level: PUBLIC_RESEARCH
  false_positives:
  - /tmp, /var/tmp, /dev/shm ya da /run/user altından çalıştırılan geliştirme
