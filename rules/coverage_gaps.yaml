- id: SATSUMA-GAP-069
  name: Kimlik bilgisi toplama aracı (LaZagne, mimipenguin)
  mitre: {tactic: Credential Access, technique: T1555}
  severity: critical
  base_match:
    source: sys_proc
    cmd_regex:
    - '(?i:lazagne|mimipenguin|linpeas|truffleHog|gitleaks\s+detect\s+--source\s+/)'
  actions: [record, evidence, ticket, correlation_request]
  classification: suspicious
  confidence: high
  schema_version: 1
  implementation_status: CURRENT_TELEMETRY
  proof_level: PUBLIC_RESEARCH
  requires: [sys_proc.cmd]
- id: SATSUMA-GAP-070
  name: Tarayıcı parola, çerez ve yer imi veritabanına erişim
  mitre: {tactic: Credential Access, technique: T1555.003}
  severity: high
  base_match:
    source: sys_proc
    cmd_regex:
    - '^(?:\S*/)?(?:cp|cat|find|sqlite3|tar|zip|7za?|rsync|scp|base64|strings|dd)\b.*?(?:logins\.json|key4\.db|places\.sqlite|cookies\.sqlite|Login\sData|Cookies|Bookmarks|Local\sState|Web\sData)\b'
  actions: [record, evidence, ticket, correlation_request]
  classification: suspicious
  confidence: medium
  schema_version: 1
  implementation_status: CURRENT_TELEMETRY
  proof_level: PUBLIC_RESEARCH
  requires: [sys_proc.cmd]
- id: SATSUMA-GAP-071
  name: Posta kutusunu kopyalama ya da silme
  mitre: {tactic: Defense Evasion, technique: T1070.008}
  severity: medium
  base_match:
    source: sys_proc
    cmd_regex:
    - '^(?:\S*/)?(?:rm|cp|mv|shred|truncate|tar)\b.*?\s/var/(?:spool/)?mail/'
  actions: [record, evidence, ticket, correlation_request]
  classification: suspicious
  confidence: medium
  schema_version: 1
  implementation_status: CURRENT_TELEMETRY
  proof_level: PUBLIC_RESEARCH
  requires: [sys_proc.cmd]
- id: SATSUMA-GAP-072
  name: Çekirdek iş parçacığı kılığında kullanıcı süreci (PF_KTHREAD yok)
  mitre: {tactic: Defense Evasion, technique: T1036.004}
  severity: critical
  base_match:
    source: memory
    action: fake_kernel_thread
  actions: [record, evidence, ticket, correlation_request]
  classification: suspicious
  confidence: high
  schema_version: 1
  implementation_status: CURRENT_TELEMETRY
  proof_level: PUBLIC_RESEARCH
  requires: [memory.action]
  false_positives: [Kendine çekirdek iş parçacığı adı veren meşru program bilinmiyor.]
- id: SATSUMA-GAP-073
  name: Çekirdek modülünü dosyadan ya da zorla yükleme
  mitre: {tactic: Persistence, technique: T1547.006}
  severity: critical
  base_match:
    source: sys_proc
    cmd_regex:
    - '^(?:\S*/)?insmod\s+(?:-\S+\s+)*\S*\.ko(?:\.xz|\.zst|\.gz)?(?:\s|$)'
    - '^(?:\S*/)?modprobe\b.*?\s(?:-f|--force|--force-modversion|--force-vermagic)(?:\s|$)'
    - '^(?:\S*/)?modprobe\b.*?\s/\S+\.ko(?:\.xz|\.zst|\.gz)?(?:\s|$)'
  actions: [record, evidence, ticket, correlation_request]
  classification: suspicious
  confidence: high
  schema_version: 1
  implementation_status: CURRENT_TELEMETRY
  proof_level: KERNEL_EXPLOIT
  requires: [sys_proc.cmd]
- id: SATSUMA-GAP-074
  name: polkit kuralı yazma (parolasız yetki verme)
  mitre: {tactic: Privilege Escalation, technique: T1548}
  severity: critical
  base_match:
    source: audit
    action: file_access
    file_path: [/etc/polkit-1/rules.d/*, /etc/polkit-1/localauthority/*, /etc/polkit-1/localauthority.conf.d/*,
                /var/lib/polkit-1/localauthority/*, /usr/share/polkit-1/rules.d/*, /usr/local/share/polkit-1/rules.d/*,
                /var/usrlocal/share/polkit-1/rules.d/*]
    operation: write
    cmd_not_regex: ['\brpm\b|rpm-ostree|ostree|\bbootc\b|\bdnf5?\b']
  actions: [record, evidence, ticket, correlation_request]
  classification: suspicious
  confidence: high
  schema_version: 1
  implementation_status: CURRENT_TELEMETRY
  proof_level: DEFENSE_TAMPERING
  requires: [audit.file_path]
- id: SATSUMA-GAP-075
  name: Satsuma ya da güvenlik paketini kaldırma, eski dağıtıma dönme
  mitre: {tactic: Defense Evasion, technique: T1562.001}
  severity: critical
  base_match:
    source: sys_proc
    cmd_regex:
    - '^(?:\S*/)?rpm-ostree\s(?=(?>.*?(?<!\S)(?:uninstall|remove)(?!\S)))(?>.*?(?<!\S)(?:satsuma\S*|clamav\S*|clamd|suricata\S*|audit|aide|firewalld|nftables|selinux-policy\S*)(?!\S))'
    - '^(?:\S*/)?rpm-ostree\s(?>.*?(?<!\S)(?:rollback|reset)(?!\S))'
    - '^(?:\S*/)?rpm-ostree\s(?=(?>.*?(?<!\S)cleanup(?!\S)))(?>.*?(?<!\S)(?:--rollback|-[a-z]*r[a-z]*)(?!\S))'
  actions: [record, evidence, ticket, correlation_request]
  classification: suspicious
  confidence: medium
  schema_version: 1
  implementation_status: CURRENT_TELEMETRY
  proof_level: DEFENSE_TAMPERING
  requires: [sys_proc.cmd]
