# Satsuma Core 2.2.54: attacks with no rule (field coverage analysis, 2026-11-19).
# A corpus of 109 Linux techniques run through the engine left 51 without any rule;
# these rules close them. Patterns are written for the command line as the kernel
# reports it (arguments joined by spaces, no shell quotes), not for shell text.
# Rules listed in satsuma.enforcement.ALARM_ONLY raise a critical alarm but never stop
# a process (the owner runs the same command on purpose, e.g. a Satsuma upgrade).
# 2.2.54: kuralı olmayan saldırılar. Kalıplar çekirdeğin bildirdiği komut satırına
# (tırnaksız, boşlukla birleştirilmiş argümanlar) göre yazıldı.
- id: SATSUMA-GAP-001
  name: Python ters shell (soket + kabuk/yönlendirme)
  mitre: {tactic: Execution, technique: T1059.006}
  severity: critical
  base_match:
    source: sys_proc
    cmd_regex:
    - '^(?>.*?\bpython[\d.]*\b)(?>.*?\s-c\s)(?>.*?(?:socket\.socket|create_connection|socket\(\)))(?>.*?(?:dup2|pty\.spawn|subprocess|/bin/(?:ba|z|da)?sh\b|\bexec\())'
  actions: [record, evidence, ticket, correlation_request]
  classification: suspicious
  confidence: high
  schema_version: 1
  implementation_status: CURRENT_TELEMETRY
  proof_level: PUBLIC_RESEARCH
  requires: [sys_proc.cmd]
  false_positives: [Soket ve kabuğu birlikte kullanan elle yazılmış tek satırlık bakım betiği.]
