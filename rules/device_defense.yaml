- id: SATSUMA-DEV-003
  name: Ham disk aygıtına yazma gözlendi
  severity: high
  classification: indicator
  confidence: low
  category: device_access
  mitre:
    technique: T1561.001
  base_match:
    source: audit
    action: file_access
    file_path:
