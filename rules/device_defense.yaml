- id: SATSUMA-DEV-001
  name: Fiziksel bellek veya I/O aygıt erişimi gözlendi
  severity: high
  classification: indicator
  confidence: low
  category: device_access
  mitre:
    technique: T1014
  base_match:
    source: audit
    action: file_access
    file_path:
    - /dev/mem
    - /dev/kmem
    - /dev/port
    operation:
    - read
    - write
  actions:
  - record
  - evidence
  - correlation_request
  schema_version: 1
  implementation_status: CURRENT_TELEMETRY
  proof_level: PUBLIC_RESEARCH
  requires:
  - audit.file_path
  - audit.operation
  false_positives:
  - Yetkili yedekleme, aygıt yönetimi, masaüstü giriş veya bakım işlemleri; erişim
    tek başına saldırı değildir.
  references:
  - https://man7.org/linux/man-pages/man4/mem.4.html
