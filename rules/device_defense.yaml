    - /dev/nvme*n*
    - /dev/mmcblk*
    - /dev/vd[a-z]*
    operation:
    - write
  actions:
  - record
  - evidence
  - correlation_request
  schema_version: 1
  implementation_status: CURRENT_TELEMETRY
  proof_level: PUBLIC_RESEARCH
  requires:
  - audit.file_path
  - audit.operation
  false_positives:
  - Yetkili yedekleme, aygıt yönetimi, masaüstü giriş veya bakım işlemleri; erişim
    tek başına saldırı değildir.
  references:
  - https://attack.mitre.org/techniques/T1561/001/
- id: SATSUMA-DEV-004
  name: Hassas aygıtta herkese açık erişim izni
  severity: high
  classification: indicator
  confidence: low
  category: device_permissions
  base_match:
    source: device_inventory
    action: sensitive_device_world_access
  actions:
  - record
  - evidence
  - correlation_request
  schema_version: 1
  implementation_status: CURRENT_TELEMETRY
  proof_level: PUBLIC_RESEARCH
  requires:
  - device_inventory.lstat
  false_positives:
  - Yetkili laboratuvar veya özel aygıt politikası; erişim izni tek başına istismar
    kanıtı değildir.
  references:
  - https://www.freedesktop.org/software/systemd/man/latest/systemd.resource-control.html
