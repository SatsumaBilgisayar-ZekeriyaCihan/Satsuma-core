- id: SATSUMA-BPF-CLI-001
  name: BPF utility invocation
  classification: indicator
  severity: low
  confidence: low
  dedup_group: bpf_cli
  base_match:
    source: sys_proc
    cmd_regex_cs: ^(?:/\S*/)?(?:bpftool|bpftrace)(?:\s|$)
  actions:
  - record
  implementation_status: CURRENT_TELEMETRY
  requires:
  - sys_proc.cmd
  proof_level: UNKNOWN/UNVERIFIED
  false_positives:
  - Authorized administration, development, observability or CNI maintenance. No path/name-only
    allowlist.
  schema_version: 1
- id: SATSUMA-BPF-CLI-002
  name: BPF program load/attach attempt
  classification: suspicious
  severity: high
  confidence: medium
  dedup_group: bpf_cli
  base_match:
    source: sys_proc
    cmd_regex_cs: ^(?:/\S*/)?bpftool\s+(?:-[\w-]+\s+)*(?:prog\s+(?:loadall|load|attach)|struct_ops\s+register|iter\s+pin)(?:\s|$)
  actions:
  - record
  - evidence
  - ticket
  - bpf_inventory
  - bpffs_inventory
  - correlation_request
  implementation_status: CURRENT_TELEMETRY
  requires:
  - sys_proc.cmd
  proof_level: UNKNOWN/UNVERIFIED
  false_positives:
  - Authorized administration, development, observability or CNI maintenance. No path/name-only
    allowlist.
  schema_version: 1
