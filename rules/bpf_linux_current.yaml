- id: SATSUMA-BPF-CLI-005
  name: bpftrace sensitive hook expression
  classification: suspicious
  severity: high
  confidence: medium
  dedup_group: bpf_cli
  base_match:
    source: sys_proc
    cmd_regex_cs: ^(?:/\S*/)?bpftrace\s+(?!-l(?:\s|$))[^\n]*(?:kprobe|kretprobe|tracepoint|uprobe|uretprobe):[^\n]*(?:getdents(?:64)?|pam_get_authtok|pam_get_user|execve)
  actions:
  - record
  - evidence
  - ticket
  - correlation_request
  implementation_status: CURRENT_TELEMETRY
  requires:
  - sys_proc.cmd
  proof_level: PUBLIC_RESEARCH
  false_positives:
  - Authorized administration, development, observability or CNI maintenance. No path/name-only
    allowlist.
  schema_version: 1
