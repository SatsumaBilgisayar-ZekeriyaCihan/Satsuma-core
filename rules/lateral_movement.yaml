- id: SATSUMA-LAT-001
  name: SSH yanal hareket — faaliyet göstergesi
  mitre:
    tactic: Lateral Movement
    technique: T1021.004
  severity: medium
  base_match:
    source: sys_proc
    cmd_contains:
    - ssh -o StrictHostKeyChecking=no
    - sshpass -p
  actions:
  - record
  - evidence
  - correlation_request
  classification: indicator
  confidence: low
  schema_version: 1
  implementation_status: CURRENT_TELEMETRY
  proof_level: PUBLIC_RESEARCH
  requires:
  - sys_proc.cmd
  false_positives:
  - Yetkili bakım, geliştirme veya güvenlik testi; sonuç ve korelasyon gerekir.
