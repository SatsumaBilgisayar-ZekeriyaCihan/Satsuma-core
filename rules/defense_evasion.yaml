- id: SATSUMA-EVAS-001
  name: Log silme
  mitre:
    tactic: Defense Evasion
    technique: T1070.002
  severity: critical
  base_match:
    source: sys_proc
    cmd_contains:
    - rm -rf /var/log
    - rm /var/log
    - '> /var/log'
    - history -c
    - shred /var/log
  actions:
  - record
  - evidence
  - ticket
  - correlation_request
  classification: suspicious
  confidence: medium
  dedup_group: log_erasure
  schema_version: 1
  implementation_status: CURRENT_TELEMETRY
  proof_level: PUBLIC_RESEARCH
  requires:
  - sys_proc.cmd
  false_positives:
  - Yetkili bakım, geliştirme veya güvenlik testi; sonuç ve korelasyon gerekir.
