- id: SATSUMA-CRED-001
  name: /etc/shadow okuma
  mitre:
    tactic: Credential Access
    technique: T1003.008
  severity: critical
  base_match:
    source: audit
    action: file_access
    file_path:
    - /etc/shadow
    - /etc/gshadow
    operation: read
  actions:
  - record
  - evidence
  - ticket
  - correlation_request
  classification: suspicious
  confidence: medium
- id: SATSUMA-CRED-002
  name: SSH private key erişimi
  mitre:
    tactic: Credential Access
    technique: T1552.004
  severity: critical
  base_match:
    source: audit
    action: file_access
    file_path:
    - /root/.ssh/id_rsa
    - /home/*/.ssh/id_rsa
    - '*.pem'
    - '*.key'
    operation: read
  actions:
  - record
  - evidence
  - ticket
  - correlation_request
  classification: suspicious
  confidence: medium
- id: SATSUMA-CRED-003
  name: Memory dump
  mitre:
    tactic: Credential Access
    technique: T1003.007
  severity: high
  base_match:
    source: sys_proc
    cmd_contains:
    - gcore
    - gdb -p
    - cat /proc/*/mem
    - strings /proc/*/mem
  actions:
  - record
  - evidence
  - ticket
  - correlation_request
  classification: suspicious
  confidence: medium
- id: SATSUMA-CRED-004
  name: Browser credential erişimi
  mitre:
    tactic: Credential Access
    technique: T1555
  severity: high
  base_match:
    source: audit
    action: file_access
    file_path:
    - '*/.mozilla/firefox/*/logins.json'
    - '*/.config/google-chrome/*/Login Data'
    - '*/.config/opera/*/Login Data'
  actions:
  - record
  - evidence
  - ticket
  - correlation_request
  classification: suspicious
  confidence: medium
- id: SATSUMA-CRED-005
  name: Kerberos ticket
  mitre:
    tactic: Credential Access
    technique: T1558
  severity: high
  base_match:
    source: audit
    action: file_access
    file_path:
    - /tmp/krb5cc_*
    - /etc/krb5.keytab
  actions:
  - record
  - evidence
  - ticket
  - correlation_request
  classification: suspicious
  confidence: medium
- id: SATSUMA-CRED-006
  name: GPG key çalma
  mitre:
    tactic: Credential Access
    technique: T1552.004
  severity: high
  base_match:
    source: audit
    action: file_access
    file_path:
    - /root/.gnupg/*
    - /home/*/.gnupg/*
  actions:
  - record
  - evidence
  - ticket
  - correlation_request
  classification: suspicious
  confidence: medium
