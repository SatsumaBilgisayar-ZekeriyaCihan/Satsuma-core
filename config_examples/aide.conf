database_in=file:/var/lib/satsuma-core/integrity/aide.db.gz
database_out=file:/var/lib/satsuma-core/integrity/aide.db.new.gz
gzip_dbout=yes
report_url=stdout
SATSUMA = p+i+n+u+g+s+m+c+sha256
/bin SATSUMA
/sbin SATSUMA
/usr/bin SATSUMA
/usr/sbin SATSUMA
/usr/lib SATSUMA
/usr/lib64 SATSUMA
/etc SATSUMA
/opt/satsuma-core SATSUMA
!/etc/satsuma-core/admin.hash
!/etc/satsuma-core/trust

# Dynamic key policy is independently HMAC-verified at each DNF gate.
!/etc/satsuma-core/package-trust

# Package-manager state changes after RPM posttrans; never use it as a trust anchor.
!/usr/lib/sysimage/rpm(/|$)
!/usr/lib/sysimage/libdnf5(/|$)
# Atomic cache replacement is expected; its content and protection remain checked.
=/etc$ p+u+g
/etc/ld\.so\.cache$ p+u+g+s+sha256

# Dynamic DNS rules are regenerated from the root-only policy/list state.
!/etc/satsuma-core/dns(/|$)
# OTX secrets are HMAC-checked independently, like package trust policy.
!/etc/satsuma-core/otx\.json(\.sig)?$
