# Runs the tests, then builds the satsuma-core RPM on Fedora 44. No passing tests, no RPM.
# Önce testler, sonra satsuma-core RPM'i Fedora 44 üzerinde. Test geçmezse RPM üretilmez.
name: Satsuma Core RPM Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: fedora:44

    steps:
      - name: Install build tools
        run: |
          dnf install -y rpm-build tar gzip coreutils findutils openssl git \
            python3 python3-pytest python3-pyyaml python3-pydantic python3-psutil \
            python3-jsonschema python3-cryptography python3-pyqt6 python3-qt5

      - name: Checkout source
        uses: actions/checkout@v4

      - name: Normalize file modes
        run: |
          # The container checkout leaves files group-writable (664); Satsuma
          # treats such files as untrusted. Git itself only stores 644/755.
          # Konteyner indirmesi dosyaları grup yazılabilir (664) bırakır; Satsuma
          # böyle dosyaları güvenilmez sayar. Git yalnız 644/755 saklar.
          chmod -R g-w,o-w "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python3 -m pytest -q -p no:cacheprovider -rf tests

      - name: Build RPM
        run: |
          # Build outside the source tree: build.sh archives the whole tree.
          # Kaynak ağacının dışında derlenir: build.sh bütün ağacı arşivler.
          export SATSUMA_RPM_BUILD_ROOT="$RUNNER_TEMP/rpmbuild"
          bash packaging/build.sh
          mkdir -p "$GITHUB_WORKSPACE/rpmbuild"
          cp -r "$SATSUMA_RPM_BUILD_ROOT/RPMS" "$GITHUB_WORKSPACE/rpmbuild/"

      - name: Locate RPM packages
        run: |
          find "$GITHUB_WORKSPACE/rpmbuild" -type f -name '*.rpm' -exec sha256sum {} +

      - name: Upload RPM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: satsuma-core-rpm
          path: rpmbuild/RPMS/**/*.rpm
          if-no-files-found: error
          retention-days: 30
