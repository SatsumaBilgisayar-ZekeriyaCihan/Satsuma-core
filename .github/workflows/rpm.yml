# Builds the satsuma-core RPM on Fedora 44. Tests are not run here.
# satsuma-core RPM'ini Fedora 44 üzerinde derler. Burada test çalışmaz.
name: Satsuma Core RPM Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: fedora:44

    steps:
      - name: Install build tools
        run: |
          dnf install -y rpm-build tar gzip coreutils findutils

      - name: Checkout source
        uses: actions/checkout@v4

      - name: Build RPM
        run: |
          # Build outside the source tree: build.sh archives the whole tree.
          # Kaynak ağacının dışında derlenir: build.sh bütün ağacı arşivler.
          export SATSUMA_RPM_BUILD_ROOT="$RUNNER_TEMP/rpmbuild"
          bash packaging/build.sh
          mkdir -p "$GITHUB_WORKSPACE/rpmbuild"
          cp -r "$SATSUMA_RPM_BUILD_ROOT/RPMS" "$GITHUB_WORKSPACE/rpmbuild/"

      - name: Locate RPM packages
        run: |
          find "$GITHUB_WORKSPACE/rpmbuild" -type f -name '*.rpm' -exec sha256sum {} +

      - name: Upload RPM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: satsuma-core-rpm
          path: rpmbuild/RPMS/**/*.rpm
          if-no-files-found: error
          retention-days: 30
