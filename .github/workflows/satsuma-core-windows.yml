# Builds satsuma-core-windows.exe on GitHub's Windows server, never on the
# owner's machine. Tests run first; no tests, no exe.
# satsuma-core-windows.exe GitHub'ın Windows sunucusunda derlenir, sahibinin
# makinesinde asla. Önce testler çalışır; test geçmezse exe üretilmez.
name: satsuma-core-windows

on:
  push:
    branches: [main]
    paths: ['satsuma-core-windows/**', 'satsuma/peer_watch.py', 'satsuma/procnet.py', 'satsuma/ram/**',
            'satsuma/memory_decision.py', 'satsuma/enforcement.py', 'rules/ram_defense.yaml',
            'rules/memory_injection.yaml', 'rules/memory_integrity.yaml',
            '.github/workflows/satsuma-core-windows.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install build and test tools
        run: python -m pip install --disable-pip-version-check "psutil>=6,<8" "pywin32>=306" "pytest>=8,<9" "pyinstaller>=6.10,<7" "PyYAML>=6,<7" "pytest-timeout>=2,<3" "cryptography>=42"
      - name: Tests (on Windows)
        working-directory: satsuma-core-windows
        run: python -m pytest -v -p no:cacheprovider --timeout 120 --timeout-method thread tests
      - name: Build satsuma-core-windows.exe
        working-directory: satsuma-core-windows
        run: >
          python -m PyInstaller --onefile --console --uac-admin --clean --noconfirm
          --name satsuma-core-windows --paths . --paths ..
          --hidden-import satsuma.peer_watch --hidden-import satsuma.procnet
          --hidden-import satsuma.memory_decision --hidden-import satsuma.enforcement
          --add-data "../rules/ram_defense.yaml;rules" --add-data "../rules/memory_injection.yaml;rules"
          --add-data "../rules/memory_integrity.yaml;rules"
          --hidden-import satsuma_win.machine_key --hidden-import win32crypt
          --hidden-import satsuma_win.sysmon --hidden-import satsuma_win.gateway --hidden-import satsuma_win.accounts --hidden-import satsuma_win.devices --hidden-import satsuma.device_policy --hidden-import satsuma.gateway_decision --hidden-import win32evtlog --hidden-import satsuma.build_tools
          --hidden-import satsuma_win.winservice --hidden-import win32timezone
          --hidden-import satsuma_win.clamav --hidden-import satsuma_win.ramscan --hidden-import satsuma.ram.engine
          --hidden-import satsuma.ram.proc --hidden-import win32job --hidden-import win32api
          satsuma_core_windows.py
      - name: Memory report (stops nothing; what the rules would stop on this server)
        working-directory: satsuma-core-windows/dist
        shell: pwsh
        run: |
          $report = & .\satsuma-core-windows.exe --memory-report | Out-String
          if ($LASTEXITCODE -ne 0) { throw "memory report failed: $report" }
          $r = $report | ConvertFrom-Json
          $r.counts | ConvertTo-Json -Compress
          "debug_privilege=$($r.debug_privilege)"
          $r.findings | ForEach-Object { "$($_.rule_id) $($_.indicator) pid=$($_.pid) $($_.image) exempt=$($_.exempt) kept=$($_.kept)" }
          $report | Set-Content -Encoding utf8 memory-report.json
      # Saved before the service is installed, so it survives even if the service stops a process of this server.
      # Hizmet kurulmadan önce kaydedilir; hizmet bu sunucunun bir sürecini durdursa bile kalır.
      - uses: actions/upload-artifact@v4
        with:
          name: memory-report
          path: satsuma-core-windows/dist/memory-report.json
          retention-days: 30
      - name: Digest
        working-directory: satsuma-core-windows/dist
        shell: pwsh
        run: |
          $h = (Get-FileHash satsuma-core-windows.exe -Algorithm SHA256).Hash.ToLower()
          "$h  satsuma-core-windows.exe" | Set-Content -Encoding ascii SHA256SUMS
          Get-Content SHA256SUMS
      # Only for the service job; the exe is published there after the proof passes.
      # Yalnızca hizmet işi için; exe orada, kanıt geçtikten sonra yayımlanır.
      - uses: actions/upload-artifact@v4
        with:
          name: satsuma-core-windows-untested
          path: |
            satsuma-core-windows/dist/satsuma-core-windows.exe
            satsuma-core-windows/dist/SHA256SUMS
          retention-days: 1

  # A separate server: if the service stops a process of this server, the build job's log and
  # memory report stay readable. Ayrı sunucu: hizmet bu sunucunun bir sürecini durdursa bile
  # derleme işinin günlüğü ve bellek raporu okunabilir kalır.
  service:
    needs: build
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          name: satsuma-core-windows-untested
          path: dist
      - name: Service end to end (install, verify, uninstall on this Windows server)
        working-directory: dist
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # What the wizard will ask the owner to approve with the password; here: this server's own agents.
          # Sihirbazın sahibine parolayla onaylatacağı şey; burada bu sunucunun kendi aracıları.
          $approve = @('--approve-location', 'C:\actions-runner', '--approve-location', 'C:\WindowsAzure')
          Get-Process | Where-Object { $_.Path -like '*\AppData\Local\Temp\provjobd*' } | ForEach-Object {
            "approving $($_.Path)"; $approve += @('--approve-file', $_.Path) }
          $install = & .\satsuma-core-windows.exe --install @approve | Out-String
          Write-Output $install
          if ($LASTEXITCODE -ne 0) { throw "install failed: $install" }
          Start-Sleep -Seconds 15
          $status = & 'C:\Program Files\Satsuma\satsuma-core-windows.exe' --status | Out-String
          Write-Output $status
          if ($LASTEXITCODE -ne 0) { throw "service not running as installed: $status" }
          Get-Content "$env:ProgramData\Satsuma\events.jsonl" -ErrorAction SilentlyContinue | Select-Object -First 10
          # Memory proof with harmless programs: three must be stopped by the service, the plain one must live.
          # Zararsız programlarla bellek kanıtı: üçü hizmet tarafından durdurulmalı, sıradan olan yaşamalı.
          $proof = Join-Path $env:RUNNER_TEMP 'proof'
          New-Item -ItemType Directory -Force -Path $proof | Out-Null
          # A build tool: a harmless copy of ping.exe named gcc.exe, outside Temp so only the build tool rule applies.
          # Derleme aracı: gcc.exe adlı zararsız ping.exe kopyası; Temp dışında, yalnızca derleme aracı kuralı geçerli.
          New-Item -ItemType Directory -Force -Path 'C:\satsuma-proof' | Out-Null
          Copy-Item "$env:SystemRoot\System32\PING.EXE" 'C:\satsuma-proof\gcc.exe'
          $tool = Start-Process -FilePath 'C:\satsuma-proof\gcc.exe' -ArgumentList '-n','90','127.0.0.1' -PassThru -WindowStyle Hidden
          $targets = @{}
          foreach ($mode in 'rwx_private','rwx_shared','rwx_thread','temp_dll','signed_temp','plain') {
            $targets[$mode] = Start-Process -FilePath python -PassThru -WindowStyle Hidden `
              -ArgumentList @("$env:GITHUB_WORKSPACE\satsuma-core-windows\proof\memory_targets.py", $mode, "$proof\$mode.pid")
          }
          Start-Sleep -Seconds 30
          $events = @(Get-Content "$env:ProgramData\Satsuma\events.jsonl" | ForEach-Object { $_ | ConvertFrom-Json } |
            Where-Object { $_.kind -eq 'memory_finding' -or $_.kind -eq 'startup_memory' })
          $events | ForEach-Object { $_ | ConvertTo-Json -Compress -Depth 4 }
          $failed = @()
          foreach ($mode in 'rwx_private','rwx_shared','rwx_thread','temp_dll') {
            $p = $targets[$mode]; $p.Refresh()
            $hit = @($events | Where-Object { $_.pid -eq $p.Id -and $_.outcome -eq 'stopped' })
            "$mode pid=$($p.Id) exited=$($p.HasExited) exit=$(if ($p.HasExited) { '0x{0:X}' -f $p.ExitCode }) stopped_records=$($hit.Count)"
            if (-not $p.HasExited -or $hit.Count -eq 0) { $failed += $mode }
          }
          foreach ($mode in 'signed_temp','plain') {
            $p = $targets[$mode]; $p.Refresh()
            "$mode pid=$($p.Id) exited=$($p.HasExited)"
            if ($p.HasExited) { $failed += "${mode}_was_stopped" } else { Stop-Process -Id $p.Id -Force }
          }
          $all = @(Get-Content "$env:ProgramData\Satsuma\events.jsonl" | ForEach-Object { $_ | ConvertFrom-Json })
          $all | Where-Object { $_.kind -like 'startup_sysmon' -or $_.kind -like 'build_tool_*' } | ForEach-Object { $_ | ConvertTo-Json -Compress }
          $tool.Refresh()
          $toolStopped = @($all | Where-Object { $_.kind -eq 'build_tool_stopped' -and [int]$_.pid -eq $tool.Id })
          "gcc.exe pid=$($tool.Id) exited=$($tool.HasExited) stopped_records=$($toolStopped.Count)"
          if (-not $tool.HasExited -or $toolStopped.Count -eq 0) { $failed += 'build_tool' }
          if (-not ($all | Where-Object { $_.kind -eq 'startup_sysmon' -and $_.ok })) { $failed += 'sysmon_not_reading' }
          # MITM guard: the modem approved at install is pinned as a permanent entry.
          # MITM bekçisi: kurulumda onaylanan modem kalıcı kayıt olarak sabitlenir.
          $gw = $all | Where-Object { $_.kind -eq 'startup_gateway' } | Select-Object -First 1
          $gw | ConvertTo-Json -Compress
          $all | Where-Object { $_.kind -like 'mitm_*' -or $_.kind -eq 'gateway_unreadable' } | Select-Object -First 10 | ForEach-Object { $_ | ConvertTo-Json -Compress -Depth 4 }
          if (-not $gw.ok) { $failed += 'gateway_not_approved' }
          else {
            $pin = Get-NetNeighbor -AddressFamily IPv4 -IPAddress $gw.gateway -ErrorAction SilentlyContinue | Where-Object { $_.State -eq 'Permanent' }
            "pinned: $($pin.IPAddress) $($pin.LinkLayerAddress) $($pin.State)"
            if (-not $pin) { $failed += 'gateway_not_pinned' }
          }
          if (@($all | Where-Object { $_.kind -eq 'mitm_write_back_failed' }).Count -gt 0) { $failed += 'mitm_write_back_failed' }
          # Logon policy: only the owner logs on; nobody from the network, the owner included.
          # Oturum ilkesi: yalnızca sahip; ağdan kimse, sahip dahil.
          $acc = $all | Where-Object { $_.kind -eq 'startup_accounts' } | Select-Object -First 1
          $acc | ConvertTo-Json -Compress -Depth 4
          $me = (whoami /user /fo csv /nh).Split(',')[-1].Trim('"')
          secedit /export /areas USER_RIGHTS /cfg "$env:RUNNER_TEMP\rights.inf" | Out-Null
          $rights = Get-Content "$env:RUNNER_TEMP\rights.inf" | Where-Object { $_ -like 'SeDeny*' }
          $rights
          # secedit writes local accounts by name. secedit yerel hesapları adla yazar.
          $guest = 'Guest'
          $meName = $env:USERNAME
          $interactive = ($rights | Where-Object { $_ -like 'SeDenyInteractiveLogonRight*' })
          $remote = ($rights | Where-Object { $_ -like 'SeDenyRemoteInteractiveLogonRight*' })
          if (-not $acc.ok) { $failed += 'accounts_not_locked' }
          if ($interactive -notlike "*$guest*") { $failed += 'guest_not_denied' }
          if ($interactive -like "*$meName*" -or $interactive -like "*$me*") { $failed += 'owner_denied_at_the_desk' }
          if ($remote -notlike "*$meName*" -and $remote -notlike "*$me*") { $failed += 'owner_rdp_not_denied' }
          # Device guard: the PPPoE miniport (owner's list) is disabled, the internet adapter is kept.
          # Aygıt bekçisi: PPPoE (sahibinin listesi) kapatılır, internet bağdaştırıcısı kalır.
          $all | Where-Object { $_.kind -like 'device_*' } | ForEach-Object { $_ | ConvertTo-Json -Compress -Depth 4 }
          $pppoe = Get-PnpDevice -FriendlyName 'WAN Miniport (PPPOE)' -ErrorAction SilentlyContinue
          "pppoe: $($pppoe.Status)"
          if ($pppoe -and $pppoe.Status -ne 'Error') { $failed += 'pppoe_not_disabled' }
          if (@($all | Where-Object { $_.kind -eq 'device_disable_failed' }).Count -gt 0) { $failed += 'device_disable_failed' }
          $kept = @($events | Where-Object { $_.pid -eq $targets['signed_temp'].Id -and $_.kept -eq 'signed_publisher' })
          if ($kept.Count -eq 0) { $failed += 'signed_temp_not_recorded' }
          # Nothing but the test programs may be stopped: no process of this server.
          # Deneme programları dışında hiçbir şey durdurulamaz: bu sunucunun hiçbir süreci.
          $ours = @($targets.Values | ForEach-Object { $_.Id })
          $others = @($events | Where-Object { $_.outcome -eq 'stopped' -and $ours -notcontains $_.pid })
          $others | ForEach-Object { "STOPPED A SERVER PROCESS: $($_.pid) $($_.image) $($_.rule_id) $($_.stop_reason)" }
          if ($others.Count -gt 0) { $failed += 'server_process_stopped' }
          if ($failed.Count -gt 0) { throw "memory proof failed: $($failed -join ', ')" }
          # RAM v2 (ClamAV memory signature scan). The marker matches only this test signature, written here on
          # the build server and never shipped; only its hex form appears in this script.
          # RAM v2 (ClamAV bellek imza taraması). İşaret yalnızca burada derleme sunucusuna yazılan, ürünle
          # gönderilmeyen deneme imzasına uyar; bu betikte yalnızca onaltılık biçimi bulunur.
          $installed = $install | ConvertFrom-Json
          "clamav at install: $($installed.clamav | ConvertTo-Json -Compress -Depth 4)"
          function Wait-Clamd([int]$seconds) {
            $until = (Get-Date).AddSeconds($seconds)
            while ((Get-Date) -lt $until) {
              $s = Get-Content "$env:ProgramData\Satsuma\state.json" -Raw -ErrorAction SilentlyContinue | ConvertFrom-Json
              if ($s.ram_signatures.clamd.state -eq 'READY') { return $s.ram_signatures }
              Start-Sleep -Seconds 5
            }
            $s.ram_signatures | ConvertTo-Json -Compress -Depth 6
            throw 'clamd did not become ready'
          }
          Wait-Clamd 600 | ConvertTo-Json -Compress -Depth 3
          $hex = '53415453554d412d52414d2d56322d50524f4f462d37663363396131653562326434303836'
          Set-Content -Encoding ascii -Path "$env:ProgramData\Satsuma\clamav\database\satsuma-proof.ndb" `
            -Value "Satsuma.Proof.RamV2:0:*:$hex"
          Restart-Service -Name SatsumaCore -Force
          Start-Sleep -Seconds 10
          Wait-Clamd 600 | ConvertTo-Json -Compress -Depth 3
          $mark = Start-Process -FilePath python -PassThru -WindowStyle Hidden `
            -ArgumentList @("$env:GITHUB_WORKSPACE\satsuma-core-windows\proof\memory_targets.py", 'ram_signature', "$proof\ram_signature.pid")
          $keep = Start-Process -FilePath python -PassThru -WindowStyle Hidden `
            -ArgumentList @("$env:GITHUB_WORKSPACE\satsuma-core-windows\proof\memory_targets.py", 'plain', "$proof\plain2.pid")
          $until = (Get-Date).AddSeconds(300)
          do {
            Start-Sleep -Seconds 5
            $found = @(Get-Content "$env:ProgramData\Satsuma\events.jsonl" | ForEach-Object { $_ | ConvertFrom-Json } |
              Where-Object { $_.kind -eq 'ram_signature_finding' })
            $mark.Refresh()
          } while ((Get-Date) -lt $until -and -not ($found | Where-Object { [int]$_.pid -eq $mark.Id -and $_.outcome -eq 'stopped' }))
          $found | ForEach-Object { $_ | ConvertTo-Json -Compress -Depth 4 }
          $s = Get-Content "$env:ProgramData\Satsuma\state.json" -Raw | ConvertFrom-Json
          $s.ram_signatures | ConvertTo-Json -Compress -Depth 6
          $mark.Refresh(); $keep.Refresh()
          $hit = @($found | Where-Object { [int]$_.pid -eq $mark.Id -and $_.outcome -eq 'stopped' -and $_.rule_id -eq 'SATSUMA-RAM-106' })
          "ram_signature pid=$($mark.Id) exited=$($mark.HasExited) stopped_records=$($hit.Count)"
          "plain2 pid=$($keep.Id) exited=$($keep.HasExited)"
          if (-not $mark.HasExited -or $hit.Count -eq 0) { $failed += 'ram_v2_marker_not_stopped' }
          if ($keep.HasExited) { $failed += 'ram_v2_plain_was_stopped' } else { Stop-Process -Id $keep.Id -Force }
          $strays = @($found | Where-Object { $_.outcome -eq 'stopped' -and [int]$_.pid -ne $mark.Id })
          $strays | ForEach-Object { "RAM V2 STOPPED A SERVER PROCESS: $($_.pid) $($_.image) $($_.signature)" }
          if ($strays.Count -gt 0) { $failed += 'ram_v2_server_process_stopped' }
          Remove-Item "$env:ProgramData\Satsuma\clamav\database\satsuma-proof.ndb" -Force
          if ($failed.Count -gt 0) { throw "ram v2 proof failed: $($failed -join ', ')" }
          $remove = & 'C:\Program Files\Satsuma\satsuma-core-windows.exe' --uninstall | Out-String
          Write-Output $remove
          if ($LASTEXITCODE -ne 0) { throw "uninstall failed: $remove" }
          secedit /export /areas USER_RIGHTS /cfg "$env:RUNNER_TEMP\after.inf" | Out-Null
          $after = Get-Content "$env:RUNNER_TEMP\after.inf" | Where-Object { $_ -like 'SeDenyRemoteInteractiveLogonRight*' }
          "after uninstall: $after"
          if ($after -like "*$meName*" -or $after -like "*$me*") { throw 'uninstall did not restore the logon rights' }
          $pppoe = Get-PnpDevice -FriendlyName 'WAN Miniport (PPPOE)' -ErrorAction SilentlyContinue
          "pppoe after uninstall: $($pppoe.Status)"
          if ($pppoe -and $pppoe.Status -eq 'Error') { throw 'uninstall did not enable the devices again' }
      - name: Digest unchanged since the build
        working-directory: dist
        shell: pwsh
        run: |
          $h = (Get-FileHash satsuma-core-windows.exe -Algorithm SHA256).Hash.ToLower()
          if ((Get-Content SHA256SUMS).Split(' ')[0] -ne $h) { throw 'exe changed between build and proof' }
          Get-Content SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: satsuma-core-windows-exe
          path: |
            dist/satsuma-core-windows.exe
            dist/SHA256SUMS
          retention-days: 30
