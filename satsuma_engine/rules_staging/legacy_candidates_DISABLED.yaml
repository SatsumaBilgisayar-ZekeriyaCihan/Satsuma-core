  title: Veri sızdırma — bulut depolamaya yükleme
  severity: high
  classification: suspicious
  confidence: medium
  category: threat-intel-extra
  enabled: false
  logsource:
    source: sys_proc
  match:
    any:
    - field: event.cmd
      regex: (?:rclone|aws\s+s3|gsutil|az\s+storage)\s+(?:copy|cp|sync|upload)
    - field: event.cmd
      regex: curl\s+.*(?:-T|--upload-file)
  actions:
  - log_only
  metadata:
    origin_file: threat_intel_extra.yaml
    staging_only: true
    original_actions_retained_in_source: true
  mitre:
  - technique: T1567.002
    tactic: exfiltration
  dedup_group: cloud_exfil
- schema: satsuma/v1
  id: SATSUMA-EXFIL-102
  title: Veri sızdırma — DNS/ICMP üzerinden
  severity: high
  classification: suspicious
  confidence: medium
  category: threat-intel-extra
  enabled: false
  logsource:
    source: sys_proc
  match:
    any:
    - field: event.cmd
      regex: (?:dig|nslookup)\s+.*\$\(.*(?:cat|base64)
    - field: event.cmd
      regex: tar\s+.*\|\s*(?:nc|ncat|curl)
  actions:
  - log_only
  metadata:
    origin_file: threat_intel_extra.yaml
    staging_only: true
    original_actions_retained_in_source: true
  mitre:
  - technique: T1048.003
    tactic: exfiltration
  dedup_group: covert_exfil
- schema: satsuma/v1
  id: SATSUMA-MINE-001
  title: Kripto madencilik — bilinen miner
  severity: high
  classification: likely
  confidence: high
  category: threat-intel-extra
