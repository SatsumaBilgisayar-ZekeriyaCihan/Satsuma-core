    staging_only: true
    original_actions_retained_in_source: true
  mitre:
  - technique: T1496
    tactic: impact
  dedup_group: cryptomining
- schema: satsuma/v1
  id: SATSUMA-RANSOM-001
  title: Fidye yazılımı — toplu dosya şifreleme göstergesi
  severity: critical
  classification: likely
  confidence: medium
  category: threat-intel-extra
  enabled: false
  logsource:
    source: sys_proc
  match:
    any:
    - field: event.cmd
      regex: openssl\s+enc\s+.*-in\s+.*-out\s+.*\.(?:enc|locked|crypt)
    - field: event.cmd
      regex: find\s+.*-type\s+f\s+.*-exec\s+.*(?:openssl|gpg)
  actions:
  - log_only
  metadata:
    origin_file: threat_intel_extra.yaml
    staging_only: true
    original_actions_retained_in_source: true
  mitre:
  - technique: T1486
    tactic: impact
  dedup_group: ransomware_encrypt
- schema: satsuma/v1
  id: SATSUMA-RANSOM-002
  title: Fidye yazılımı — gölge kopya silme
  severity: critical
  classification: likely
  confidence: high
  category: threat-intel-extra
  enabled: false
  logsource:
    source: sys_proc
  match:
    any:
    - field: event.cmd
      regex: (?:vssadmin|wbadmin)\s+delete
    - field: event.cmd
      regex: rm\s+-rf\s+.*(?:snapshot|backup)
    - field: event.cmd
      regex: btrfs\s+subvolume\s+delete
  actions:
  - log_only
  metadata:
    origin_file: threat_intel_extra.yaml
    staging_only: true
    original_actions_retained_in_source: true
  mitre:
  - technique: T1490
    tactic: impact
  dedup_group: ransomware_backup_wipe
