# PROPOSALS ONLY; not loaded from satsuma_engine/rules. All enabled=false, log_only.
- schema: satsuma/v1
  id: SATSUMA-BPF-CLI-001
  title: BPF utility invocation
  severity: low
  classification: indicator
  confidence: low
  category: bpf-linux-current
  enabled: false
  logsource:
    source: sys_proc
  match:
    field: event.cmd
    regex: ^(?:/\S*/)?(?:bpftool|bpftrace)(?:\s|$)
  actions:
  - log_only
  metadata:
    origin_file: bpf_linux_current.yaml
    staging_only: true
    original_actions_retained_in_source: true
  dedup_group: bpf_cli
- schema: satsuma/v1
