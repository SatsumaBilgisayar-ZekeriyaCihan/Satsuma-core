# Satsuma hardening, tier 1: restrictions no Satsuma root service uses.
# Satsuma sertleştirme, 1. katman: hiçbir Satsuma root servisinin kullanmadığı kısıtlar.
# Verified against the code of privd, operator, reader, guardian, containment and
# the guard: none loads kernel modules, reads the kernel log, changes the clock
# or hostname, creates namespaces, switches personality or needs realtime.
[Service]
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
ProtectClock=yes
ProtectHostname=yes
RestrictRealtime=yes
RestrictSUIDSGID=yes
LockPersonality=yes
RestrictNamespaces=yes
SystemCallArchitectures=native
