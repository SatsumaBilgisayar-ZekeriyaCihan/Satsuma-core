# Satsuma hardening, tier 2 for the Suricata/OTX guard (known needs).
# Bekçi için 2. katman (bilinen ihtiyaçlar).
#  CAP_NET_ADMIN       nft sets, ss -K socket destroy, conntrack
#  CAP_SYS_PTRACE      /proc/<pid>/fd, exe and memory reads of other users' processes
#  CAP_DAC_READ_SEARCH read Suricata logs and other users' files
#  CAP_DAC_OVERRIDE    write its state under /var/lib/satsuma-core
#  CAP_FOWNER          keep file modes on its own state files
# Writes only /var/lib/satsuma-core; AF_INET(6) for OTX and PTR/DNS, AF_NETLINK for nft.
[Service]
CapabilityBoundingSet=CAP_NET_ADMIN CAP_SYS_PTRACE CAP_DAC_READ_SEARCH CAP_DAC_OVERRIDE CAP_FOWNER
RestrictAddressFamilies=AF_INET AF_INET6 AF_NETLINK AF_UNIX
ProtectSystem=strict
ReadWritePaths=/var/lib/satsuma-core
