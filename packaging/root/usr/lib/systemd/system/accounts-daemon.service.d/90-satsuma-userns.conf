# Satsuma Core 2.2.54. Satsuma's strict kernel profile sets user.max_user_namespaces=0
# (93-satsuma-strict.conf), so systemd cannot give this service the private user
# namespace its unit asks for (PrivateUsers=) and the service fails with
# "Failed to set up user namespacing: No space left on device" (field 2026-11-19,
# upower). The kernel setting stays strict; only this one sandbox option is dropped.
# Satsuma'nın sıkı çekirdek ayarı kullanıcı ad alanını kapatır; servis yine çalışsın
# diye yalnızca bu seçenek kaldırılır, çekirdek ayarı sıkı kalır.
[Service]
PrivateUsers=no
