# Satsuma 2.2.11: Fedora's nftables.service loads Satsuma's firewall
# (/etc/satsuma-core/nftables.nft) at boot, as a second layer next to
# satsuma-network.service (user decision 2026-10-26).
# - Loads only when the satsuma_core table is absent, so the rules are never
#   added twice and the table never stops matching Satsuma's own check.
# - Stopping or reloading never runs "flush ruleset": every Satsuma table
#   (satsuma_core, satsuma_rescue, satsuma_otx_guard) stays in place.
#
# Satsuma 2.2.11: Fedora'nın nftables.service'i açılışta Satsuma güvenlik
# duvarını yükler; satsuma_core tablosu yoksa yükler, durdurma ya da yeniden
# yükleme hiçbir zaman "flush ruleset" çalıştırmaz.
[Service]
ExecStart=
ExecStart=/bin/sh -c '/usr/sbin/nft list table inet satsuma_core >/dev/null 2>&1 || exec /usr/sbin/nft -f /etc/satsuma-core/nftables.nft'
ExecReload=
ExecReload=/bin/sh -c '/usr/sbin/nft list table inet satsuma_core >/dev/null 2>&1 || exec /usr/sbin/nft -f /etc/satsuma-core/nftables.nft'
ExecStop=
