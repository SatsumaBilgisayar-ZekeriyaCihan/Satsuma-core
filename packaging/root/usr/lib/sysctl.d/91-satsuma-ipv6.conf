# Satsuma 2.2.9: IPv6 is off on this machine (user decision 2026-10-26).
# The satsuma_core firewall also drops every IPv6 packet as its first rule.
# Satsuma 2.2.9: bu makinede IPv6 kapalı; güvenlik duvarı da her IPv6
# paketini ilk kural olarak düşürür.
net.ipv6.conf.all.disable_ipv6 = 1
net.ipv6.conf.default.disable_ipv6 = 1
net.ipv6.conf.lo.disable_ipv6 = 1
