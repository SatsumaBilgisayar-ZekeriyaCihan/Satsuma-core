# Satsuma memory hardening, kept by systemd-sysctl itself (field log
# 2026-10-25: systemd-sysctl restored Fedora's defaults after Satsuma set
# these, so early-guard locked responses). Sorts after Fedora's
# 10-default-yama-scope.conf and 50-coredump.conf. Since 2.2.37 a later file
# setting ptrace_scope to anything but 2 is not accepted: 3 blinds the RAM
# scanner, and satsuma-kernel-guard comments that line out (satsuma.ptrace_guard).
# 2.2.37'den beri ptrace_scope'u 2'den başka değere çeken sonraki dosya kabul
# edilmez: 3 RAM tarayıcısını kör eder; satsuma-kernel-guard o satırı kapatır.
# Satsuma bellek sertleştirmesi; değerleri systemd-sysctl'in kendisi yazar.
kernel.yama.ptrace_scope = 2
kernel.kptr_restrict = 2
kernel.dmesg_restrict = 1
fs.suid_dumpable = 0
kernel.core_pattern = |/usr/bin/false
